<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
  text {font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;}
  .mono {font-family: "SF Mono", "Menlo", monospace;}
</style><defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B9B2A2"/>
    </marker>
    <marker id="arW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8452D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- 顶部标识 -->
  <text x="72" y="64" font-size="13" letter-spacing="5" fill="#B08A6A">WORKBUDDY SKILL</text>
  <text x="72" y="118" font-size="42" font-weight="600" fill="#1A1A1A" letter-spacing="1">科普视频 Skill 是怎么跑起来的</text>
  <text x="72" y="158" font-size="18" fill="#6B6B6B">给一个题目，产出一条 45 秒横屏 mp4：分镜、配音、画面、混音全自动</text>

  <!-- 输入条 -->
  <g>
    <rect x="1112" y="82" width="416" height="76" rx="12" fill="#FBF8F1" stroke="#E7E1D4"/>
    <text x="1136" y="112" font-size="13" fill="#8C8C8C" letter-spacing="2">你需要给的</text>
    <text x="1136" y="140" font-size="17" fill="#1A1A1A">题目 · MiniMax Key · 确认一句话</text>
  </g>

  <!-- 六步 -->
  <g>
    <!-- 卡片坐标：x = 72 + i*248, 宽 214, 高 200, y 210 -->
    <g>
      <rect x="72" y="210" width="214" height="200" rx="14" fill="#FBF8F1" stroke="#E7E1D4"/>
      <text x="96" y="256" font-size="26" font-weight="600" fill="#C8452D" letter-spacing="1">01</text>
      <text x="96" y="296" font-size="22" font-weight="600" fill="#1A1A1A">写分镜</text>
      <text x="96" y="330" font-size="14" fill="#6B6B6B">六屏结构 + 解说词</text>
      <text x="96" y="352" font-size="14" fill="#6B6B6B">落到 分镜.md</text>
    </g>

    <g>
      <rect x="320" y="210" width="214" height="200" rx="14" fill="#FFFCF3" stroke="#C8452D" stroke-width="1.5"/>
      <text x="344" y="256" font-size="26" font-weight="600" fill="#C8452D" letter-spacing="1">02</text>
      <text x="344" y="296" font-size="22" font-weight="600" fill="#1A1A1A">你确认</text>
      <text x="344" y="330" font-size="14" fill="#6B6B6B">说「可以」才往下走</text>
      <text x="344" y="352" font-size="14" fill="#C8452D">全程只卡这一下</text>
    </g>

    <g>
      <rect x="568" y="210" width="214" height="200" rx="14" fill="#FBF8F1" stroke="#E7E1D4"/>
      <text x="592" y="256" font-size="26" font-weight="600" fill="#C8452D" letter-spacing="1">03</text>
      <text x="592" y="296" font-size="22" font-weight="600" fill="#1A1A1A">铺项目</text>
      <text x="592" y="330" font-size="14" fill="#6B6B6B">scaffold.mjs 生成</text>
      <text x="592" y="352" font-size="14" fill="#6B6B6B">可运行的 Remotion 骨架</text>
    </g>

    <g>
      <rect x="816" y="210" width="214" height="200" rx="14" fill="#FBF8F1" stroke="#E7E1D4"/>
      <text x="840" y="256" font-size="26" font-weight="600" fill="#C8452D" letter-spacing="1">04</text>
      <text x="840" y="296" font-size="22" font-weight="600" fill="#1A1A1A">配音定长</text>
      <text x="840" y="330" font-size="14" fill="#6B6B6B">MiniMax 出声，量长度</text>
      <text x="840" y="352" font-size="14" fill="#6B6B6B">每屏帧数 = 语音 + 0.8 秒</text>
    </g>

    <g>
      <rect x="1064" y="210" width="214" height="200" rx="14" fill="#FBF8F1" stroke="#E7E1D4"/>
      <text x="1088" y="256" font-size="26" font-weight="600" fill="#C8452D" letter-spacing="1">05</text>
      <text x="1088" y="296" font-size="22" font-weight="600" fill="#1A1A1A">逐屏画</text>
      <text x="1088" y="330" font-size="14" fill="#6B6B6B">SVG + 帧号计算</text>
      <text x="1088" y="352" font-size="14" fill="#6B6B6B">一屏一文件，写完截图</text>
    </g>

    <g>
      <rect x="1312" y="210" width="214" height="200" rx="14" fill="#FBF8F1" stroke="#E7E1D4"/>
      <text x="1336" y="256" font-size="26" font-weight="600" fill="#C8452D" letter-spacing="1">06</text>
      <text x="1336" y="296" font-size="22" font-weight="600" fill="#1A1A1A">渲染</text>
      <text x="1336" y="330" font-size="14" fill="#6B6B6B">remotion render → mp4</text>
      <text x="1336" y="352" font-size="14" fill="#6B6B6B">校验 −16 LUFS</text>
    </g>

    <!-- 箭头 -->
    <line x1="288" y1="310" x2="314" y2="310" stroke="#B9B2A2" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="536" y1="310" x2="562" y2="310" stroke="#B9B2A2" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="784" y1="310" x2="810" y2="310" stroke="#B9B2A2" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="1032" y1="310" x2="1058" y2="310" stroke="#B9B2A2" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="1280" y1="310" x2="1306" y2="310" stroke="#B9B2A2" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- 05 的自检回环 -->
  <g>
    <path d="M1171 412 L1171 448 Q1171 462 1157 462 L1145 462 Q1131 462 1131 448 L1131 420"
          fill="none" stroke="#C8452D" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arW)"/>
    <text x="1188" y="452" font-size="13" fill="#C8452D">不通过就只改这一屏</text>
  </g>

  <!-- 底座 -->
  <g>
    <rect x="72" y="494" width="1024" height="150" rx="14" fill="#F4F1E8" stroke="#E7E1D4"/>
    <text x="96" y="530" font-size="13" fill="#8C8C8C" letter-spacing="3">BASE · 第 3–6 步共用</text>

    <g font-size="16" fill="#1A1A1A">
      <rect x="96" y="548" width="238" height="72" rx="10" fill="#FFFFFF" stroke="#E7E1D4"/>
      <text x="114" y="578" class="mono" font-size="15">tokens.ts</text>
      <text x="114" y="602" font-size="13" fill="#6B6B6B">配色 / 字号 / 动画节奏</text>

      <rect x="346" y="548" width="238" height="72" rx="10" fill="#FFFFFF" stroke="#E7E1D4"/>
      <text x="364" y="578" class="mono" font-size="15">components/</text>
      <text x="364" y="602" font-size="13" fill="#6B6B6B">星空 / 逐句字幕 / 标题</text>

      <rect x="596" y="548" width="238" height="72" rx="10" fill="#FFFFFF" stroke="#E7E1D4"/>
      <text x="614" y="578" class="mono" font-size="15">bgm.mp3</text>
      <text x="614" y="602" font-size="13" fill="#6B6B6B">CC0，可商用</text>

      <rect x="846" y="548" width="228" height="72" rx="10" fill="#FFFFFF" stroke="#E7E1D4"/>
      <text x="864" y="578" class="mono" font-size="15">narration.json</text>
      <text x="864" y="602" font-size="13" fill="#6B6B6B">解说词唯一来源</text>
    </g>
  </g>

  <!-- 产物 -->
  <g>
    <rect x="1112" y="494" width="416" height="150" rx="14" fill="#1F1F1F"/>
    <text x="1136" y="530" font-size="13" fill="#B9B2A2" letter-spacing="3">OUTPUT</text>
    <text x="1136" y="574" class="mono" font-size="22" fill="#FFFFFF">out/video.mp4</text>
    <text x="1136" y="602" font-size="13" fill="#B9B2A2">1920×1080 · 30fps · H.264 + AAC</text>
    <text x="1136" y="624" font-size="13" fill="#B9B2A2">中文解说 · 逐句字幕 · 配乐压到不抢人声</text>
  </g>

  <!-- 底部两条说明 -->
  <g>
    <text x="72" y="700" font-size="15" fill="#C8452D">↺</text>
    <text x="96" y="700" font-size="15" fill="#1A1A1A">
      <tspan fill="#6B6B6B">改了某句解说词 → 重跑 </tspan><tspan class="mono">tts.mjs</tspan><tspan fill="#6B6B6B"> → 该屏帧数重算 → 画面节奏自动跟着变长变短，不用手调帧号</tspan>
    </text>

    <text x="72" y="742" font-size="15" fill="#C8452D">↺</text>
    <text x="96" y="742" font-size="15" fill="#6B6B6B">动画只由帧号算出来，禁用 CSS 动画、setTimeout、Math.random() —— 同一条命令重跑，画面逐帧一致</text>
  </g>

  <!-- 页脚 -->
  <line x1="72" y1="806" x2="1528" y2="806" stroke="#EDE9DE" stroke-width="1"/>
  <text x="72" y="840" font-size="14" fill="#8C8C8C">github.com/seeyouintokyo/science-video-skill</text>
  <text x="1528" y="840" font-size="14" fill="#8C8C8C" text-anchor="end">微信：staraiwork</text>
</svg>